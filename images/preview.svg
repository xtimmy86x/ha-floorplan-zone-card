<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Floorplan Zone Card preview</title>
  <desc id="desc">A mock floorplan with two state-driven polygon zones.</desc>
  <rect width="1200" height="675" rx="28" fill="#f5f5f5"/>
  <rect x="38" y="38" width="1124" height="599" rx="22" fill="#ffffff" stroke="#d6d6d6" stroke-width="3"/>
  <text x="74" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#222222">Floorplan Zone Card</text>
  <text x="74" y="132" font-family="Arial, sans-serif" font-size="18" fill="#666666">Draw zones directly on the floorplan and bind them to Home Assistant entities.</text>
  <g transform="translate(74 172)">
    <rect width="1052" height="410" rx="16" fill="#eef1f3" stroke="#c8ced3" stroke-width="3"/>
    <path d="M30 30H450V190H670V30H1022V380H650V255H430V380H30Z" fill="#ffffff" stroke="#7e8790" stroke-width="5"/>
    <path d="M450 30V190M670 30V190M430 255V380M650 255V380" stroke="#7e8790" stroke-width="5"/>
    <polygon points="52,52 425,52 425,170 52,170" fill="#ff3b30" fill-opacity="0.48" stroke="#ff3b30" stroke-width="4"/>
    <polygon points="690,52 998,52 998,225 690,225" fill="#34c759" fill-opacity="0.30" stroke="#34c759" stroke-width="4"/>
    <circle cx="52" cy="52" r="9" fill="#03a9f4" stroke="#ffffff" stroke-width="3"/>
    <circle cx="425" cy="52" r="9" fill="#03a9f4" stroke="#ffffff" stroke-width="3"/>
    <circle cx="425" cy="170" r="9" fill="#03a9f4" stroke="#ffffff" stroke-width="3"/>
    <circle cx="52" cy="170" r="9" fill="#03a9f4" stroke="#ffffff" stroke-width="3"/>
    <text x="80" y="122" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9c1611">Machine room · ON</text>
    <text x="728" y="145" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#16752e">Warehouse · OFF</text>
    <text x="470" y="235" font-family="Arial, sans-serif" font-size="19" fill="#59636b">Click points · drag vertices · save</text>
  </g>
