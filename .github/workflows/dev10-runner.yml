name: Apply dev.10 patch after validation

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stop when dev.10 is already applied
        id: state
        shell: bash
        run: |
          if grep -q 'const VERSION = "0.1.0-dev.10";' src/ha-floorplan-zone-card.js; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch
        if: steps.state.outputs.applied == 'false'
        run: python scripts/apply-dev10.py

      - name: Validate and build
        if: steps.state.outputs.applied == 'false'
        run: |
          npm run check
          npm run build
          cmp src/ha-floorplan-zone-card.js dist/ha-floorplan-zone-card.js

      - name: Commit dev.10
        if: steps.state.outputs.applied == 'false'
        shell: bash
        run: |
          rm -f scripts/apply-dev10.py .github/workflows/dev10-render-patch.yml .github/workflows/dev10-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(zoom): preserve floorplan image quality"
          git push
