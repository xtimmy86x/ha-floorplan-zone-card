name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run check
      - run: npm run build
      - name: Ensure dist is up to date
        run: git diff --exit-code -- dist/

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: plugin
          # Repository metadata/images will be completed before any future
          # submission to the HACS default repository list.
          ignore: description topics images

  publish_021:
    needs: [build, hacs]
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore: publish v0.2.1' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c573b719c419f646626aefc19c66a47a978f01fc
      - name: Publish v0.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Floorplan Zone Card 0.2.1
          
          This maintenance release fixes a Home Assistant visual editor issue that could interrupt typing in zone settings.
          
          ### Fixed
          - Preserve input focus when editing exact state values, custom labels, and auto-zoom conditions.
          - Avoid resetting the editor scroll position after each typed character.
          - Prevent subsequent keystrokes from accidentally triggering Home Assistant search or keyboard shortcuts after focus is lost.
          
          ### Technical
          - Skip the full editor re-render when Home Assistant echoes an unchanged configuration back via `setConfig()`.
          - Retain re-rendering for genuine configuration changes and validation on field change.
          - Add regression tests for state-value typing and auto-zoom condition editing.
          - Keep the HACS distribution bundle synchronized.
          
          No configuration migration is required.
          EOF
          gh release create v0.2.1 dist/ha-floorplan-zone-card.js \
            --target c573b719c419f646626aefc19c66a47a978f01fc \
            --title "Floorplan Zone Card 0.2.1" \
            --notes-file /tmp/release-notes.md
