name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run check
      - run: npm run build
      - name: Ensure dist is up to date
        run: git diff --exit-code -- dist/

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: plugin
          # Publishing metadata is intentionally deferred while the card is in
          # early development. Remove these ignores before the first release.
          ignore: description topics images

  dev12_patch:
    needs: [build, hacs]
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore: retry dev.12 SVG alignment fix' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply dev.12 SVG alignment changes
        run: python scripts/apply_dev12.py
      - name: Validate
        run: npm run check
      - name: Build distribution bundle
        run: npm run build
      - name: Ensure source and distribution match
        run: cmp src/ha-floorplan-zone-card.js dist/ha-floorplan-zone-card.js
      - name: Commit dev.12
        shell: bash
        run: |
          git rm scripts/apply_dev12.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(svg): align SVG object zones with floorplan"
          git push
